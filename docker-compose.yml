version: '3.9'

services:
  web:
    build: .
    container_name: barberking_web
    restart: always
    env_file: .env
    environment:
      - TZ=America/Bogota
      - DATABASE_URL=sqlite:////app/instance/barberking.db
      - FLASK_ENV=production
      - SECRET_KEY=barberking_super_secret_key_fixed
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=barberking_secret_key
    volumes:
      - barberking_db:/app/instance
      - barberking_uploads:/app/app/static/uploads
    command: gunicorn --bind 0.0.0.0:81 --workers 2 --threads 2 --timeout 60 --preload run:app
    depends_on:
      - evolution_api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:81/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    environment:
      - TZ=America/Bogota
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=barberking_secret_key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://barber_user:barber_pass@postgres:5432/evolution_db?sslmode=disable
      - SERVER_URL=http://localhost:8085
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=barberking_redis_password
    ports:
      - "8085:8080"
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: barberking_redis
    restart: always
    command: redis-server --requirepass barberking_redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "barberking_redis_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: barberking_postgres
    restart: always
    environment:
      - POSTGRES_USER=barber_user
      - POSTGRES_PASSWORD=barber_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - barberking_wa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber_user -d evolution_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  barberking_db:
    driver: local
  barberking_uploads:
    driver: local
  barberking_wa_db:
    driver: local
