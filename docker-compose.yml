version: '3.9'

services:
  web:
    build: .
    container_name: barberking_web
    restart: always
    env_file: .env
    networks:
      - barkerking_net
    command: gunicorn --bind 0.0.0.0:81 --workers 1 --timeout 60 run:app

  nginx:
    image: nginx:alpine
    container_name: barberking_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - barkerking_net

networks:
  barkerking_net:
    driver: bridge
