version: '3.8'

services:
  web:
    build: .
    container_name: barberia_flask_app
    expose:
      - "80"
    volumes:
      - .:/app
      - /app/__pycache__
      - barberking_uploads:/app/app/static/uploads
    environment:
      - TZ=${TZ:-America/Bogota}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_APP=${FLASK_APP:-run.py}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_DB_HOST=${EVOLUTION_DB_HOST}
      - EVOLUTION_DB_PORT=${EVOLUTION_DB_PORT}
      - EVOLUTION_DB_USER=${EVOLUTION_DB_USER}
      - EVOLUTION_DB_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - EVOLUTION_DB_NAME=${EVOLUTION_DB_NAME}
      - EVOLUTION_SERVER_URL=${EVOLUTION_SERVER_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PREFIX=${REDIS_PREFIX}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-5242880}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-memory://}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - DEFAULT_INSTANCE=${DEFAULT_INSTANCE:-barberking}
    command: gunicorn --bind 0.0.0.0:80 --workers 2 --threads 2 --timeout 60 --preload run:app
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution_api:
        condition: service_started
    networks:
      - coolify
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_barberking
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-barber_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-barber_pass}
      - POSTGRES_DB=${POSTGRES_DB:-barberking_db}
      - POSTGRES_INITDB_ARGS=-c shared_preload_libraries=pg_stat_statements
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    volumes:
      - barberking_wa_db:/var/lib/postgresql/data
      - ./init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres-entrypoint.sh:/custom-entrypoint.sh
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barber_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_barberking
    command: redis-server --appendonly yes
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - barberking_redis_data:/data
    networks:
      - coolify
    restart: unless-stopped

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api_whatsapp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - TZ=${TZ:-America/Bogota}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@${EVOLUTION_DB_HOST}:${EVOLUTION_DB_PORT}/${EVOLUTION_DB_NAME}?sslmode=disable
      - DATABASE_URL=postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@${EVOLUTION_DB_HOST}:${EVOLUTION_DB_PORT}/${EVOLUTION_DB_NAME}?sslmode=disable
      - DATABASE_SAVE_DATA_INSTANCE=true
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - REDIS_ENABLED=true
      - REDIS_URI=redis://${REDIS_HOST}:${REDIS_PORT}/0
      - REDIS_PREFIX_KEY=${REDIS_PREFIX:-evolution}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://${REDIS_HOST}:${REDIS_PORT}/1
      - CACHE_REDIS_PREFIX_KEY=cache
      - CACHE_REDIS_TTL=604800
      - CACHE_LOCAL_ENABLED=false
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true

volumes:
  barberking_uploads:
  barberking_wa_db:
  barberking_redis_data:
