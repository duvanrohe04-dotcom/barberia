version: '3.9'

services:
  web:
    build: .
    container_name: barberking_web
    restart: always
    env_file: .env
    environment:
      - TZ=America/Bogota
    volumes:
      - barberking_db:/app/instance
      - barberking_uploads:/app/app/static/uploads
    command: gunicorn --bind 0.0.0.0:81 --workers 2 --threads 2 --timeout 60 --preload run:app
    depends_on:
      - evolution_api

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    environment:
      - TZ=America/Bogota
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=barberking_secret_key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://barber_user:barber_pass@postgres:5432/evolution_db?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=barberking_redis_password
    ports:
      - "8085:8080"
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:alpine
    container_name: barberking_redis
    restart: always
    command: redis-server --requirepass barberking_redis_password

  postgres:
    image: postgres:15-alpine
    container_name: barberking_postgres
    restart: always
    environment:
      - POSTGRES_USER=barber_user
      - POSTGRES_PASSWORD=barber_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - barberking_wa_db:/var/lib/postgresql/data

volumes:
  barberking_db:
    driver: local
  barberking_uploads:
    driver: local
  barberking_wa_db:
    driver: local
