services:
  web:
    build: .
    restart: always
    environment:
      - TZ=America/Bogota
      - DATABASE_URL=postgresql://barber_user:barber_pass@postgres:5432/barberking_db
      - FLASK_ENV=production
      - SECRET_KEY=barberking_super_secret_key_fixed
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=barberking_secret_key
    volumes:
      - barberking_uploads:/app/app/static/uploads
    command: gunicorn --bind 0.0.0.0:81 --workers 2 --threads 2 --timeout 60 --preload run:app
    depends_on:
      postgres:
        condition: service_healthy
      evolution_api:
        condition: service_started
    networks:
      - barber_net

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - TZ=America/Bogota
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=barberking_secret_key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://barber_user:barber_pass@postgres:5432/evolution_db?sslmode=disable
      - DATABASE_DB=evolution_db
      - DATABASE_SAVE_DATA_INSTANCE=true
      - SERVER_URL=https://jsbarbershopcol.sbs.mom
      # Redis - instancia principal para sesiones WhatsApp
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/0
      - REDIS_PREFIX_KEY=evolution
      # Cache - Evolution API v2.x requiere el prefijo CACHE_ por separado
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=cache
      - CACHE_REDIS_TTL=604800
      - CACHE_LOCAL_ENABLED=false
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - barber_net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - barberking_redis_data:/data
    networks:
      - barber_net

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=barber_user
      - POSTGRES_PASSWORD=barber_pass
      - POSTGRES_DB=barberking_db
    volumes:
      - barberking_postgres_new:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber_user -d barberking_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber_net

networks:
  barber_net:
    driver: bridge

volumes:
  barberking_db:
  barberking_uploads:
  barberking_postgres_new:
  barberking_redis_data:
