version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: barberking_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barkerking_net

  web:
    build: .
    container_name: barberking_web
    restart: always
    env_file: .env
    ports:
      - "81:81"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barkerking_net
    command: gunicorn --bind 0.0.0.0:81 --workers 4 --threads 2 --timeout 60 run:app

  nginx:
    image: nginx:alpine
    container_name: barberking_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - barkerking_net

volumes:
  postgres_data:

networks:
  barkerking_net:
    driver: bridge
