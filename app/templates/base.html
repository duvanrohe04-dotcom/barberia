<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{% block title %}BarberKing{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<!-- Canvas de partículas (fondo global) -->
<canvas id="particleCanvas"></canvas>

{% block body %}{% endblock %}
<div class="toast" id="toast"></div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js')
    .then(() => console.log('Service Worker registrado'))
    .catch(err => console.log('Error al registrar Service Worker:', err));
}
</script>
<script src="{{ url_for('static', filename='js/utils.js') }}?v=7"></script>
<script src="{{ url_for('static', filename='js/particles.js') }}?v=2"></script>
{% block scripts %}{% endblock %}
</body>
</html>

<!-- ✅ Actualización v35: Soporte para mensajes toast mejorados -->
