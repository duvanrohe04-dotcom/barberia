<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
{% if config_shop_logo %}
<link rel="icon" href="{{ config_shop_logo }}">
{% else %}
<link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
{% endif %}
<title>{% block title %}{{ config_shop_name }}{% endblock %}</title>

<!-- Open Graph / Redes Sociales (WhatsApp, Facebook, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ config_shop_name }}">
<meta property="og:description" content="Reserva tu cita fácilmente en nuestra barbería y salón de estilismo.">
{% if config_shop_logo %}
<meta property="og:image" content="{{ config_shop_logo }}">
{% else %}
<meta property="og:image" content="{{ url_for('static', filename='icons/icon-512.png', _external=True) }}">
{% endif %}
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
{% if config_shop_logo %}
<link rel="apple-touch-icon" href="{{ config_shop_logo }}">
{% else %}
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
{% endif %}
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=47">
</head>
<body>
<!-- Canvas de partículas (fondo global) -->
<canvas id="particleCanvas"></canvas>

{% block body %}{% endblock %}
<div class="toast" id="toast"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js?v=48')
      .then(reg => console.log('Service Worker registrado'))
      .catch(err => console.warn('Service Worker no disponible:', err));
  });
}
</script>
<script src="{{ url_for('static', filename='js/utils.js') }}?v=47"></script>
<script src="{{ url_for('static', filename='js/particles.js') }}?v=47"></script>
{% block scripts %}{% endblock %}
</body>
</html>

<!-- ✅ Actualización v47: Cache busting + timezone fix -->
