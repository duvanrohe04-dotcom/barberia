upstream barberking {
    server web:80;
}

server {
    listen 80;
    server_name _;

    # Seguridad - ocultar versión
    server_tokens off;

    # Límite de tamaño de petición
    client_max_body_size 5M;

    # Headers de seguridad adicionales
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Rate limiting para prevenir ataques de fuerza bruta
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Archivos estáticos con caché moderado
    location /static/ {
        proxy_pass http://barberking/static/;
        expires 1d;
        add_header Cache-Control "public, no-cache";
        # Prevenir ejecución de scripts en uploads
        location ~* \.(php|jsp|asp|aspx)$ {
            deny all;
        }
    }

    # Rate limiting en login
    location /auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://barberking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting en API
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://barberking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy a Flask (otras rutas)
    location / {
        proxy_pass http://barberking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
